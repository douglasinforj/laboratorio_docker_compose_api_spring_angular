services:

  postgres:
    image: postgres:16-alpine
    container_name: lab_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       lab_db
      POSTGRES_USER:     lab_user
      POSTGRES_PASSWORD: lab_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data   # persistência
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql  # script inicial
    networks:
      - lab_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab_user -d lab_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:          # volume nomeado — dados sobrevivem ao container

networks:
  lab_network:
    driver: bridge        # rede isolada — só containers do compose se enxergam